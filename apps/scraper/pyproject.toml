[project]
name = "nobetcim-scraper"
version = "0.1.0"
description = "Scrapes on-duty pharmacies from e-Devlet (TİTCK) into PostgreSQL"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.13",
    "lxml>=6.0",
    "psycopg[binary]>=3.2",
    "requests>=2.32",
    "sqlalchemy>=2.0.40",
]

[dependency-groups]
dev = ["ruff>=0.14"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
