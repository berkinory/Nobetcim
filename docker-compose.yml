# Coolify production deployment (raw compose). The data volume and the
# `coolify` network already exist; the proxy reaches `web` through the
# `nobetcim-coolify-web` alias on port 1001.
services:
    postgres:
        image: postgres@sha256:16bc17c64a573ef34162af9298258d1aec548232985b33ed7b1eac33ba35c229
        restart: unless-stopped
        environment:
            POSTGRES_USER: nobetcim
            POSTGRES_PASSWORD: nobetcim
            POSTGRES_DB: nobetcim
        volumes:
            - postgres_data:/var/lib/postgresql/data
        networks:
            private:
                aliases:
                    - postgres
        healthcheck:
            test: [CMD-SHELL, pg_isready -U nobetcim -d nobetcim]
            interval: 5s
            timeout: 5s
            retries: 10
        container_name: coolify-nobetcim-postgres

    # API + static web app. Applies db/migrations on start.
    web:
        build:
            context: .
            dockerfile: apps/api/Dockerfile
            args:
                VITE_MAPTILER_API_KEY: ${MAPTILER_API_KEY:-}
        restart: unless-stopped
        environment:
            DATABASE_URL: postgresql://nobetcim:nobetcim@postgres:5432/nobetcim
            PORT: '1001'
        expose:
            - '1001'
        depends_on:
            postgres:
                condition: service_healthy
        networks:
            private:
                aliases:
                    - web
            coolify:
                aliases:
                    - nobetcim-coolify-web
        container_name: coolify-nobetcim-web

    scraper:
        build:
            context: ./apps/scraper
        restart: unless-stopped
        environment:
            DATABASE_URL: postgresql://nobetcim:nobetcim@postgres:5432/nobetcim
        # Lets an in-flight city finish and save on redeploys.
        stop_grace_period: 2m
        depends_on:
            postgres:
                condition: service_healthy
            # `web` runs the migrations the scraper writes against.
            web:
                condition: service_healthy
        networks:
            - private
        container_name: coolify-nobetcim-scraper

networks:
    private: {}
    coolify:
        external: true

volumes:
    postgres_data:
        external: true
        name: nobetcim-production-hxazn1_postgres_data
